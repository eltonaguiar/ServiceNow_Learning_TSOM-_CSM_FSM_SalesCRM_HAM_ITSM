title: ServiceNow Module Guides
description: Getting started guides for ServiceNow TSOM, CSM, FSM, Sales CRM, HAM, ITSM, and Discovery modules
theme: jekyll-theme-minimal
show_downloads: false
google_analytics:
plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter

# Rewrite [...](...md) links to their built URLs so markdown cross-links work on Pages.
relative_links:
  enabled: true
  collections: false
markdown: kramdown
highlighter: rouge
permalink: pretty
exclude:
  - .git/
  - .github/
  - scripts/
  - data/
  - SUCCESS_PACK_OPENCODE.MD
  - SUCCESS_PACK_HERMES.MD
  - README.md